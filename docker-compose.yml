version: '3.8'

services:
  mcms-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aura-mcms-turnkey
    restart: always
    ports:
      - "80:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
    volumes:
      - mcms-db:/app

volumes:
  mcms-db:
    name: aura-mcms-data
